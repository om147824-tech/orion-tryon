<style>

</style></head><body><div id="stage"><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas><div id="top"><span id="status">Selecciona una prenda</span><button id="flip" hidden>Girar cámara</button></div><div id="browserDemo" hidden style="position:absolute;top:54px;left:10px;right:10px;background:#000b;padding:8px;border-radius:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap"><select id="demoKind" aria-label="Tipo de producto"><option value="glasses">Lentes</option><option value="top">Parte superior</option><option value="bottom">Pantalón</option><option value="dress">Vestido</option><option value="hat">Gorra</option><option value="headphones">Audífonos</option><option value="manual">Otro</option></select><label class="file" for="demoImage">Cargar PNG de producto</label><input id="demoImage" type="file" accept="image/*" hidden></div><div id="center">Activa tu cámara para probarte un producto.</div><div id="controls"><button id="start">Activar cámara</button><label class="file" for="file">Galería</label><input id="file" type="file" accept="image/*"><button id="manual" hidden>Ajuste manual</button><div id="adjust" hidden><label for="scale">Tamaño</label><input id="scale" type="range" min="50" max="180" value="100"><button id="reset">↺</button></div><button id="capture" hidden aria-label="Capturar fotografía">●</button><button id="resume" hidden>Volver a cámara</button><button id="save" hidden>Guardar</button><button id="share" hidden>Compartir</button></div></div>
<script type="module">
const $=id=>document.getElementById(id), video=$('video'), canvas=$('canvas'), ctx=canvas.getContext('2d',{alpha:false});
const CDN='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304';
const models={face:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',pose:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task'};
let apiPromise, visionPromise, taskPromises={}, stream=null, facing='user', source=null, frozen=null, mirrored=false, item=null, garment=null, detected=null, lastSeen=0,lastInference=0,lastVideo=-1,mode='auto', factor=1, dx=0,dy=0, active=true, request=0, cameraRequest=0, error='', loading=false, captureBusy=false, startBusy=false, stillNeedsDetection=false, tracker=null, lastTimestamp=0;
const post=(type,other={})=>window.ReactNativeWebView?.postMessage(JSON.stringify({type,...other}));
function status(text){$('status').textContent=text;}
function kind(){return ['glasses','hat','headphones'].includes(item?.kind)?'face': ['top','bottom','dress'].includes(item?.kind)?'pose':null;}
function size(){const b=$('stage').getBoundingClientRect();if(!b.width||!b.height)return;const ratio=Math.min(devicePixelRatio||1, 1.5, 900/Math.max(b.width,b.height));const w=Math.max(1,Math.round(b.width*ratio)),h=Math.max(1,Math.round(b.height*ratio));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;detected=null;lastVideo=-1;stillNeedsDetection=!!source&&source!==video;}}
new ResizeObserver(size).observe($('stage'));size();
function clearTracking(){detected=null;lastSeen=0;lastVideo=-1;lastInference=0;stillNeedsDetection=!!source&&source!==video;}
function reset(){factor=1;dx=0;dy=0;$('scale').value=100;clearTracking();}
async function getTask(type){if(!taskPromises[type])taskPromises[type]=(async()=>{apiPromise ||= import(`${CDN}/vision_bundle.mjs`);const api=await apiPromise;visionPromise ||= api.FilesetResolver.forVisionTasks(`${CDN}/wasm`);const files=await visionPromise;const cls=type==='face'?api.FaceLandmarker:api.PoseLandmarker;const options={baseOptions:{modelAssetPath:models[type],delegate:'CPU'},runningMode:'VIDEO',minTrackingConfidence:.5,...(type==='face'?{numFaces:1,minFaceDetectionConfidence:.5,minFacePresenceConfidence:.5}:{numPoses:1,minPoseDetectionConfidence:.5,minPosePresenceConfidence:.5})};return {instance:await cls.createFromOptions(files,options),runningMode:'VIDEO'};})().catch(e=>{delete taskPromises[type];apiPromise=null;visionPromise=null;throw e;});return taskPromises[type];}
async function loadTracker(){const id=request,type=kind();tracker=null;error='';loading=!!type;clearTracking();if(!type){mode='manual';loading=false;ui();return;}ui();try{const t=await getTask(type);if(id!==request)return;tracker=t;loading=false;stillNeedsDetection=!!source&&source!==video;ui();}catch(e){if(id!==request)return;console.error(e);loading=false;error='No se cargó la IA. Puedes ajustar manualmente.';mode='manual';ui();}}
function trim(img){const c=document.createElement('canvas');const scale=Math.min(1,700/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);const p=x.getImageData(0,0,c.width,c.height).data;let l=c.width,r=-1,t=c.height,b=-1;for(let y=0;y<c.height;y++)for(let z=0;z<c.width;z++)if(p[(y*c.width+z)*4+3]>15){l=Math.min(l,z);r=Math.max(r,z);t=Math.min(t,y);b=Math.max(b,y);}if(r<l)throw Error('La imagen es transparente por completo.');const out=document.createElement('canvas');out.width=r-l+1;out.height=b-t+1;out.getContext('2d').drawImage(c,l,t,out.width,out.height,0,0,out.width,out.height);return out;}
function setProduct(p){if(frozen){frozen=null;if(source===video&&!stream)source=null;}const id=++request;item=p;garment=null;mode='auto';tracker=null;loading=false;error='';reset();ui();const img=new Image();img.onload=()=>{if(id!==request)return;try{garment=trim(img);loadTracker();}catch(e){error=e.message;ui();}};img.onerror=()=>{if(id===request){error='No se pudo abrir la imagen de la prenda.';ui();}};img.src=p.image;}
window.orionReceive=m=>{if(m.type==='product')setProduct(m);if(m.type==='clear'){if(frozen){frozen=null;if(source===video&&!stream)source=null;}request++;item=null;garment=null;tracker=null;loading=false;error='';reset();ui();}if(m.type==='active'){active=m.active;if(!active){stopCamera();if(source===video){source=null;clearTracking();}ui();}}if(m.type==='captureDone'){captureBusy=false;ui();}};
function stopCamera(){cameraRequest++;stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;}
async function startCamera(){if(!active||startBusy)return;startBusy=true;stopCamera();const id=cameraRequest;source=null;frozen=null;clearTracking();ui();try{if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia)throw Error('La cámara necesita una página HTTPS y un navegador compatible.');const next=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:640},height:{ideal:480}}});if(id!==cameraRequest||!active){next.getTracks().forEach(t=>t.stop());return;}stream=next;video.srcObject=stream;await video.play();if(id!==cameraRequest||!active)return;source=video;mirrored=facing==='user';clearTracking();error='';}catch(e){if(id===cameraRequest){stopCamera();source=null;error='Cámara no disponible: '+(e.message||e.name);}}finally{startBusy=false;ui();}}
$('start').onclick=startCamera;$('resume').onclick=startCamera;$('flip').onclick=()=>{facing=facing==='user'?'environment':'user';startCamera();};
$('file').onchange=()=>{const file=$('file').files?.[0];$('file').value='';if(!file)return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{stopCamera();source=img;mirrored=false;frozen=null;clearTracking();error='';ui();URL.revokeObjectURL(url);};img.onerror=()=>{URL.revokeObjectURL(url);error='No se pudo abrir la foto.';ui();};img.src=url;};
$('manual').onclick=()=>{mode=mode==='manual'&&kind()&&tracker?'auto':'manual';reset();ui();};$('scale').oninput=e=>factor=Number(e.target.value)/100;$('reset').onclick=reset;
function ui(){const has=!!source, isFrozen=!!frozen;$('start').hidden=has||startBusy;$('flip').hidden=source!==video||isFrozen;$('manual').hidden=!has||!garment||isFrozen;$('manual').textContent=mode==='auto'?'Ajuste manual':tracker?'Seguimiento automático':'Ajuste manual';$('manual').disabled=mode==='manual'&&!tracker;$('adjust').hidden=!has||!garment||isFrozen;$('capture').hidden=!has||isFrozen;$('capture').disabled=!garment;$('resume').hidden=!isFrozen&&(!has||source===video);$('resume').textContent='Volver a cámara';$('save').hidden=!isFrozen;$('share').hidden=!isFrozen;$('save').disabled=captureBusy;$('share').disabled=captureBusy;$('center').hidden=has;$('center').textContent=startBusy?'Abriendo cámara…':'Activa tu cámara para probarte un producto.';}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y),mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2}),angle=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x),add=(a,x,y)=>({x:a.x+x,y:a.y+y});
function geometry(){const w=source===video?video.videoWidth:source.naturalWidth,h=source===video?video.videoHeight:source.naturalHeight;if(!w||!h)return null;const k=source===video?Math.max(canvas.width/w,canvas.height/h):Math.min(canvas.width/w,canvas.height/h);return {w:w*k,h:h*k,x:(canvas.width-w*k)/2,y:(canvas.height-h*k)/2};}
function landmark(p,g){return {x:g.x+(mirrored?1-p.x:p.x)*g.w,y:g.y+p.y*g.h};}
function ordered(a,b){return a.x<=b.x?[a,b]:[b,a];}
function autoFit(l,g){const p=i=>landmark(l[i],g), visible=(...ids)=>ids.every(i=>l[i]&&(l[i].visibility??1)>.45);let a,b,c,w,h,rot;const ar=garment.height/garment.width;
if(kind()==='face'){[a,b]=ordered(p(234),p(454));const [e1,e2]=ordered(mid(p(33),p(133)),mid(p(362),p(263)));rot=angle(e1,e2);const fw=dist(a,b),eyes=mid(e1,e2);if(fw<12)return null;if(item.kind==='glasses'){c=eyes;w=fw*1.07;h=w*ar;}else if(item.kind==='hat'){const forehead=p(10);w=fw*1.36;h=w*ar;c=add(forehead,Math.sin(rot)*h*.20,-Math.cos(rot)*h*.20);}else{w=fw*1.42;h=w*ar;c=mid(p(10),p(152));c=add(c,Math.sin(rot)*h*.12,-Math.cos(rot)*h*.12);}}
else {if(!visible(11,12,23,24))return null;const [s1,s2]=ordered(p(11),p(12)),[h1,h2]=ordered(p(23),p(24));const shoulders=mid(s1,s2),hips=mid(h1,h2),torso=dist(shoulders,hips);if(torso<12)return null;rot=angle(s1,s2);if(item.kind==='top'){w=dist(s1,s2)*1.55;h=torso*1.30;c=add(mid(shoulders,hips),0,torso*.08);}else{const ends=item.kind==='dress'?[25,26]:[27,28];if(!visible(...ends))return null;const legs=mid(p(ends[0]),p(ends[1]));if(item.kind==='dress'){w=Math.max(dist(s1,s2),dist(h1,h2))*1.48;h=dist(shoulders,legs)*1.13;c=mid(shoulders,legs);}else{w=dist(h1,h2)*1.60;h=dist(hips,legs)*1.12;c=mid(hips,legs);rot=angle(h1,h2);}}}
const fit=item.fit||{},num=(v,d)=>typeof v==='number'&&Number.isFinite(v)?v:d;return {x:c.x+num(fit.offsetX,0)*w,y:c.y+num(fit.offsetY,0)*h,w:w*clamp(num(fit.width,1),.2,3),h:h*clamp(num(fit.height,1),.2,3),rot:clamp(rot,-1.3,1.3)};}
function smooth(n){if(!detected){detected=n;return;}const a=.42;for(const k of ['x','y','w','h','rot'])detected[k]+=a*(n[k]-detected[k]);}
async function detectStill(t,img,id){try{if(t.runningMode!=='IMAGE'){await t.instance.setOptions({runningMode:'IMAGE'});t.runningMode='IMAGE';}if(id!==request||source!==img||frozen||!active)return;const result=t.instance.detect(img);const l=kind()==='face'?result.faceLandmarks?.[0]:result.landmarks?.[0],g=geometry();const n=l&&g?autoFit(l,g):null;if(n){detected=n;lastSeen=performance.now();}else detected=null;}catch(e){error='No se pudo detectar la pose en esta foto.';detected=null;}finally{detecting=false;}}
let detecting=false;
async function ensureVideo(t,id){try{await t.instance.setOptions({runningMode:'VIDEO'});t.runningMode='VIDEO';lastVideo=-1;}catch(e){if(id===request){mode='manual';error='No se pudo activar el seguimiento.';ui();}}finally{detecting=false;}}
function infer(now,g){if(!tracker||!garment||mode!=='auto'||detecting)return;if(source!==video){if(stillNeedsDetection){stillNeedsDetection=false;detecting=true;detectStill(tracker,source,request);}return;}if(tracker.runningMode!=='VIDEO'){detecting=true;ensureVideo(tracker,request);return;}if(now-lastInference<100||video.currentTime===lastVideo)return;lastVideo=video.currentTime;lastInference=now;try{lastTimestamp=Math.max(lastTimestamp+.01,now);const res=tracker.instance.detectForVideo(video,lastTimestamp);const lm=kind()==='face'?res.faceLandmarks?.[0]:res.landmarks?.[0];const n=lm?autoFit(lm,g):null;if(n){smooth(n);lastSeen=now;}}catch(e){console.error(e);mode='manual';error='Falló el seguimiento. Usa ajuste manual.';ui();}}
function manualFit(){const w=canvas.width*(kind()==='face'?.52:.72),h=w*garment.height/garment.width;return {x:canvas.width*.5,y:canvas.height*(kind()==='face'?.42:.55),w,h,rot:0};}
function draw(now){requestAnimationFrame(draw);if(!active)return;const W=canvas.width,H=canvas.height;ctx.fillStyle='#181818';ctx.fillRect(0,0,W,H);if(frozen){ctx.drawImage(frozen,0,0,W,H);status('Fotografía capturada');return;}const g=source&&geometry();if(g){ctx.save();if(mirrored){ctx.translate(W,0);ctx.scale(-1,1);}ctx.drawImage(source,g.x,g.y,g.w,g.h);ctx.restore();if(garment){infer(now,g);if(source===video&&now-lastSeen>550)detected=null;const fit=mode==='manual'?manualFit():detected;if(fit){ctx.save();ctx.translate(fit.x+dx,fit.y+dy);ctx.rotate(fit.rot);ctx.drawImage(garment,-fit.w*factor/2,-fit.h*factor/2,fit.w*factor,fit.h*factor);ctx.restore();}}}status(error||(!source?'Cámara desactivada':!garment?'Cargando producto…':mode==='manual'?'Ajuste manual · arrastra la prenda':loading?'Cargando modelo de visión…':detected?'Seguimiento automático':kind()==='face'?'Centra tu rostro':item?.kind==='top'?'Muestra hombros y caderas':'Aléjate hasta mostrar tu cuerpo'));}
requestAnimationFrame(draw);
let pointer=null;canvas.onpointerdown=e=>{if(!source||frozen||!garment)return;pointer={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!pointer)return;const b=canvas.getBoundingClientRect();dx+=(e.clientX-pointer.x)*canvas.width/b.width;dy+=(e.clientY-pointer.y)*canvas.height/b.height;pointer={x:e.clientX,y:e.clientY};};canvas.onpointerup=canvas.onpointercancel=()=>pointer=null;
$('capture').onclick=()=>{if(!source||!garment||(!detected&&mode==='auto')){status('Espera a que se detecte la prenda o activa ajuste manual.');return;}frozen=document.createElement('canvas');frozen.width=canvas.width;frozen.height=canvas.height;frozen.getContext('2d').drawImage(canvas,0,0);stopCamera();ui();};
function exportPhoto(action){if(!frozen||captureBusy)return;const uri=frozen.toDataURL('image/jpeg',.92);if(window.ReactNativeWebView){captureBusy=true;ui();post('capture',{action,image:uri});}else{const a=document.createElement('a');a.href=uri;a.download='orion-look.jpg';a.click();}}
if(!window.ReactNativeWebView){$('browserDemo').hidden=false;let demoData=null;const demo=()=>{if(demoData)setProduct({name:'Prueba local',kind:$('demoKind').value,image:demoData});};$('demoKind').onchange=demo;$('demoImage').onchange=()=>{const f=$('demoImage').files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{demoData=r.result;demo();};r.readAsDataURL(f);};}
$('save').onclick=()=>exportPhoto('save');$('share').onclick=()=>exportPhoto('share');window.addEventListener('pagehide',stopCamera);ui();post('ready');
</script></body></html>
